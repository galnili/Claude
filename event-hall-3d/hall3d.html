<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const VIDEO = /video/.test(location.search);
if (VIDEO || /still/.test(location.search)) document.body.classList.add('video');

// ---------- coordinate system: sketch pixels -> metres (dimension 1237cm = 368px) ----------
const S = 12.37/368, OX = 385, OY = 990;
const W = (px,py)=>[ (px-OX)*S, (py-OY)*S ];
let seed = 11; const rnd = ()=>((seed = (seed*16807)%2147483647)-1)/2147483646;
const H = 4.2;   // wall / ceiling height

// ---------- renderer / scene ----------
const host = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:VIDEO});
renderer.setPixelRatio(VIDEO ? 1 : Math.min(devicePixelRatio,1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#121214');
scene.fog = new THREE.Fog('#121214', 75, 160);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;

const camera = new THREE.PerspectiveCamera(VIDEO?56:45, 1, 0.05, 400);
camera.position.set(28, 42, 46);

scene.add(new THREE.HemisphereLight('#fff4e4', '#3a3128', 0.6));
const key = new THREE.DirectionalLight('#fff0dc', 1.5);
key.position.set(-14, 40, 10);
key.castShadow = true;
key.shadow.mapSize.set(4096,4096);
Object.assign(key.shadow.camera,{left:-36,right:36,top:36,bottom:-36,near:1,far:110});
key.shadow.bias = -0.0005; key.shadow.normalBias = 0.04; key.shadow.radius = 4;
scene.add(key);
[[0,-19],[0,-8],[0,3],[0,14],[-6,0],[6,0],[0,22],[16,-12],[16,-6]].forEach(([x,z])=>{
  const p=new THREE.PointLight('#ffd29a', 16, 15, 2); p.position.set(x,2.9,z); scene.add(p);
});

// ---------- procedural textures ----------
function canvasTex(w,h,draw,rx=1,ry=rx,srgb=true){
  const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry);
  if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
function veins(g,w,h,n,col,a0,a1,wid){
  g.lineCap='round';
  for(let v=0;v<n;v++){ g.strokeStyle=`rgba(${col},${a0+rnd()*(a1-a0)})`; g.lineWidth=wid*(0.4+rnd());
    g.beginPath(); let x=rnd()*w,y=rnd()*h; g.moveTo(x,y); const dx=(rnd()-0.5)*2, dy=(rnd()-0.5)*2;
    for(let k=0;k<10;k++){x+=dx*60+(rnd()-0.5)*90; y+=dy*60+(rnd()-0.5)*90; g.lineTo(x,y);} g.stroke(); }
}
// Calacatta tiles: 4x4 tiles of 1.2m per repeat (4.8m)
const calacatta = canvasTex(1024,1024,(g,w,h)=>{
  g.fillStyle='#f3f0ea'; g.fillRect(0,0,w,h);
  for(let i=0;i<3000;i++){g.fillStyle=`rgba(200,190,175,${rnd()*0.06})`;g.fillRect(rnd()*w,rnd()*h,rnd()*40,rnd()*40);}
  veins(g,w,h,10,'150,140,128',.15,.35,3); veins(g,w,h,14,'176,150,105',.08,.2,1.6); veins(g,w,h,30,'160,155,150',.05,.12,.8);
  g.strokeStyle='rgba(150,140,125,.45)'; g.lineWidth=1.5;
  for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*w/4,0);g.lineTo(i*w/4,h);g.stroke();g.beginPath();g.moveTo(0,i*h/4);g.lineTo(w,i*h/4);g.stroke();}
}, 1/4.8);
// dance floor: inlaid marble medallion (11.2m x 6.05m)
const medallion = canvasTex(1344,726,(g,w,h)=>{
  g.fillStyle='#f4f1eb'; g.fillRect(0,0,w,h); veins(g,w,h,16,'150,140,128',.08,.2,2);
  const band=(m,col)=>{g.fillStyle=col; g.fillRect(m,m,w-2*m,h-2*m);};
  band(0,'#1c1c1e'); band(28,'#c9a35e'); band(34,'#f1ede6'); veins(g,w,h,10,'150,140,128',.06,.15,2);
  g.strokeStyle='#1c1c1e'; g.lineWidth=10; g.strokeRect(70,70,w-140,h-140);
  g.strokeStyle='#c9a35e'; g.lineWidth=3; g.strokeRect(84,84,w-168,h-168);
  const cx=w/2, cy=h/2;
  [[300,'#1c1c1e'],[292,'#c9a35e'],[282,'#efe9df'],[210,'#2a2a2c'],[200,'#c9a35e'],[192,'#f6f2ec']].forEach(([r,c])=>{g.fillStyle=c;g.beginPath();g.arc(cx,cy,r,0,7);g.fill();});
  const star=(R,r,n,col,rot=0)=>{g.fillStyle=col;g.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n+rot,rr=i%2?r:R;g.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}g.closePath();g.fill();};
  star(270,95,8,'#c9a35e',Math.PI/8); star(250,80,8,'#2a2a2c'); star(180,70,8,'#d8b878',Math.PI/8); star(150,55,8,'#f6f2ec');
  g.fillStyle='#c9a35e'; g.beginPath(); g.arc(cx,cy,34,0,7); g.fill(); g.fillStyle='#1c1c1e'; g.beginPath(); g.arc(cx,cy,18,0,7); g.fill();
  [[90,90,0],[w-90,90,Math.PI/2],[w-90,h-90,Math.PI],[90,h-90,-Math.PI/2]].forEach(([x,y,a])=>{
    g.fillStyle='#c9a35e';g.beginPath();g.moveTo(x,y);g.arc(x,y,90,a,a+Math.PI/2);g.closePath();g.fill();
    g.fillStyle='#2a2a2c';g.beginPath();g.moveTo(x,y);g.arc(x,y,70,a,a+Math.PI/2);g.closePath();g.fill();});
}, 1);
medallion.wrapS=medallion.wrapT=THREE.ClampToEdgeWrapping;
// boiserie wall panels: one repeat = 3.0m wide x 4.2m tall
const panels = canvasTex(512,716,(g,w,h)=>{
  const Y=m=>h-m/H*h;
  g.fillStyle='#f1eadf'; g.fillRect(0,0,w,h);
  const frame=(x0,y0,x1,y1)=>{g.strokeStyle='rgba(120,100,75,.35)';g.lineWidth=6;g.strokeRect(x0,y0,x1-x0,y1-y0);
    g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=2;g.strokeRect(x0+4,y0+4,x1-x0-8,y1-y0-8);
    g.strokeStyle='#c4a064';g.lineWidth=2;g.strokeRect(x0+14,y0+14,x1-x0-28,y1-y0-28);};
  frame(70,Y(3.75),w-70,Y(1.2));
  frame(70,Y(0.85),w-70,Y(0.2));
  g.fillStyle='#e6dccd'; g.fillRect(0,Y(1.05),w,Y(0.95)-Y(1.05));
  g.fillStyle='#c4a064'; g.fillRect(0,Y(1.0),w,3);
  g.fillStyle='#e2d7c6'; g.fillRect(0,Y(0.14),w,h-Y(0.14));
  g.fillStyle='#c4a064'; g.beginPath(); g.arc(w/2,Y(3.95),10,0,7); g.fill();
}, 1, 1);
// coffered ceiling: 3m repeat
const coffers = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#efe7da'; g.fillRect(0,0,w,h);
  const m=60; const gr=g.createLinearGradient(m,m,w-m,h-m); gr.addColorStop(0,'#e4d8c6'); gr.addColorStop(1,'#f8f2e8');
  g.fillStyle=gr; g.fillRect(m,m,w-2*m,h-2*m);
  g.strokeStyle='#c4a064'; g.lineWidth=5; g.strokeRect(m+12,m+12,w-2*m-24,h-2*m-24);
  g.strokeStyle='rgba(110,90,60,.35)'; g.lineWidth=8; g.strokeRect(m,m,w-2*m,h-2*m);
  g.fillStyle='#c9a35e'; for(let i=0;i<12;i++){const a=i/12*Math.PI*2; g.beginPath(); g.ellipse(w/2+Math.cos(a)*30,h/2+Math.sin(a)*30,22,9,a,0,7); g.fill();}
  g.fillStyle='#f6efe3'; g.beginPath(); g.arc(w/2,h/2,18,0,7); g.fill();
}, 1/3);
// stage backdrop: ivory wall with a central arched mirror and two side niches (9.1m x 3.6m)
const backdrop = canvasTex(1456,640,(g,w,h)=>{
  g.fillStyle='#f1eadf'; g.fillRect(0,0,w,h);
  const arch=(cx,bw,top,bot,mirror)=>{ const r=bw/2;
    const path=()=>{g.beginPath();g.moveTo(cx-r,bot);g.lineTo(cx-r,top+r);g.arc(cx,top+r,r,Math.PI,0);g.lineTo(cx+r,bot);g.closePath();};
    g.save(); path(); g.clip();
    const gr=g.createLinearGradient(0,top,0,bot);
    if(mirror){gr.addColorStop(0,'#d9c3a0');gr.addColorStop(.5,'#8d7a63');gr.addColorStop(1,'#3d352d');}
    else {gr.addColorStop(0,'#e9dfcf');gr.addColorStop(1,'#d8cab4');}
    g.fillStyle=gr; g.fillRect(cx-r,top,bw,bot-top);
    if(mirror){ g.strokeStyle='rgba(255,255,255,.18)'; g.lineWidth=40; g.beginPath(); g.moveTo(cx-r*0.6,bot); g.lineTo(cx+r*0.2,top); g.stroke(); }
    g.restore();
    g.strokeStyle='#c4a064'; g.lineWidth=14; path(); g.stroke();
  };
  arch(w/2,420,60,h,true); arch(w*0.2,220,150,h-40,false); arch(w*0.8,220,150,h-40,false);
  g.fillStyle='#c4a064'; g.fillRect(0,20,w,8); g.fillRect(0,h-30,w,4);
}, 1);
backdrop.wrapS=backdrop.wrapT=THREE.ClampToEdgeWrapping;

// ---------- materials ----------
const M = {
  ground:  new THREE.MeshStandardMaterial({color:'#1b1b1e', roughness:1}),
  marble:  new THREE.MeshStandardMaterial({map:calacatta, roughness:.14, envMapIntensity:1.1}),
  medal:   new THREE.MeshStandardMaterial({map:medallion, roughness:.08, envMapIntensity:1.3}),
  runner:  new THREE.MeshStandardMaterial({color:'#efe6d6', roughness:1}),
  ivory:   new THREE.MeshStandardMaterial({color:'#f2ebe0', roughness:.6}),
  ivoryM:  new THREE.MeshStandardMaterial({color:'#f6f2ec', roughness:.25}),
  panel:   new THREE.MeshStandardMaterial({map:panels, roughness:.7}),
  ceiling: new THREE.MeshStandardMaterial({map:coffers, roughness:.9, emissive:'#ffffff', emissiveMap:coffers, emissiveIntensity:.42, side:THREE.FrontSide}),
  backdrop:new THREE.MeshStandardMaterial({map:backdrop, roughness:.35, envMapIntensity:1.2}),
  cloth:   new THREE.MeshPhysicalMaterial({color:'#fbf7ef', roughness:.92, sheen:.6, sheenRoughness:.6, sheenColor:new THREE.Color('#ffffff')}),
  gold:    new THREE.MeshStandardMaterial({color:'#d2ad6a', metalness:1, roughness:.28}),
  cushion: new THREE.MeshStandardMaterial({color:'#f4eee4', roughness:.85}),
  plate:   new THREE.MeshStandardMaterial({color:'#ffffff', roughness:.2}),
  glass:   new THREE.MeshPhysicalMaterial({color:'#ffffff', roughness:.04, transparent:true, opacity:.3, envMapIntensity:1.8}),
  crystal: new THREE.MeshStandardMaterial({color:'#ffffff', roughness:.02, metalness:.1, envMapIntensity:3, emissive:'#fff1d8', emissiveIntensity:.35}),
  velvet:  new THREE.MeshPhysicalMaterial({color:'#e8dcc8', roughness:.9, sheen:1, sheenColor:new THREE.Color('#fff6e6')}),
  flame:   new THREE.MeshStandardMaterial({color:'#fff4e2', emissive:'#ffbe6a', emissiveIntensity:9}),
  bulb:    new THREE.MeshStandardMaterial({color:'#fff8ec', emissive:'#ffd59a', emissiveIntensity:7}),
};

// ---------- helpers ----------
const shadowy=m=>{m.castShadow=true;m.receiveShadow=true;return m;};
function box(w,h,d,mat,x,y,z,ry=0){const m=shadowy(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat));m.position.set(x,y,z);m.rotation.y=ry;scene.add(m);return m;}
function slab(x0,y0,x1,y1,h,mat,yBase=0){const [ax,az]=W(x0,y0),[bx,bz]=W(x1,y1);
  return box(Math.abs(bx-ax),h,Math.abs(bz-az),mat,(ax+bx)/2,yBase+h/2,(az+bz)/2);}
function shapeOf(pts,flip){return new THREE.Shape(pts.map(p=>{const [x,z]=W(...p);return new THREE.Vector2(x,flip?-z:z);}));}
function polyFloor(pts,mat,h=0.08){
  const g=new THREE.ExtrudeGeometry(shapeOf(pts,true),{depth:h,bevelEnabled:false}); g.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(g,mat); m.receiveShadow=true; scene.add(m); return m;}
function ceiling(pts){ // faces downward only: visible from inside, invisible from above
  const g=new THREE.ShapeGeometry(shapeOf(pts,false)); g.rotateX(Math.PI/2);
  const m=new THREE.Mesh(g,M.ceiling); m.position.y=H; scene.add(m);}
function stadiumShape(cx,cz,w,l){const r=w/2,s=new THREE.Shape();
  s.absarc(cx,-(cz-(l/2-r)),r,Math.PI,0,true); s.absarc(cx,-(cz+(l/2-r)),r,0,Math.PI,true); return s;}
function runner(x0,y0,x1,y1){
  const [ax,az]=W(x0,y0),[bx,bz]=W(x1,y1),cx=(ax+bx)/2,cz=(az+bz)/2,w=bx-ax,l=bz-az;
  const g=new THREE.ShapeGeometry(stadiumShape(cx,cz,w,l),48); g.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(g,M.runner); m.position.y=0.085; m.receiveShadow=true; scene.add(m);
  const ring=stadiumShape(cx,cz,w,l); ring.holes.push(stadiumShape(cx,cz,w-0.16,l-0.16));
  const rg=new THREE.ShapeGeometry(ring,48); rg.rotateX(-Math.PI/2);
  const r=new THREE.Mesh(rg,M.gold); r.position.y=0.087; scene.add(r);
}

// collected instances
const balusters=[], bulbs=[], crystals=[], chairs=[], settings=[], pieces=[], chandeliers=[];
const pilasters=[];
const pilasterG = mergeGeometries([
  new THREE.BoxGeometry(.5,.25,.2).translate(0,.125,0),
  new THREE.BoxGeometry(.42,H-0.7,.13).translate(0,.25+(H-0.7)/2,0),
]);
const capitalG = mergeGeometries([
  new THREE.BoxGeometry(.52,.1,.2).translate(0,H-.4,0),
  new THREE.BoxGeometry(.46,.16,.17).translate(0,H-.27,0),
  new THREE.BoxGeometry(.6,.06,.24).translate(0,H-.16,0),
]);
function wall(x0,y0,x1,y1,h=H,t=0.24){
  const [ax,az]=W(x0,y0),[bx,bz]=W(x1,y1);
  const len=Math.hypot(bx-ax,bz-az); if(len<0.05)return;
  const ry=-Math.atan2(bz-az,bx-ax), cx=(ax+bx)/2, cz=(az+bz)/2;
  const dx=(bx-ax)/len, dz=(bz-az)/len, nx=-dz, nz=dx;
  if(h<2){ // balustrade
    box(len,0.14,t,M.ivoryM,cx,0.07,cz,ry);
    box(len+0.1,0.08,t+0.08,M.ivoryM,cx,h-0.04,cz,ry);
    box(len+0.1,0.02,t+0.1,M.gold,cx,h+0.01,cz,ry);
    const n=Math.floor(len/0.17); for(let i=0;i<n;i++){const s=-len/2+(i+0.5)*len/n; balusters.push([cx+dx*s,cz+dz*s,h]);}
    return;
  }
  const tex=panels.clone(); tex.needsUpdate=true; tex.repeat.set(len/3.0,1);
  const pm=M.panel.clone(); pm.map=tex;
  const m=shadowy(new THREE.Mesh(new THREE.BoxGeometry(len+t,h,t),[M.ivory,M.ivory,M.ivory,M.ivory,pm,pm]));
  m.position.set(cx,h/2,cz); m.rotation.y=ry; scene.add(m);
  box(len+t+0.3,0.22,t+0.34,M.ivoryM,cx,h-0.11,cz,ry);
  box(len+t+0.32,0.035,t+0.36,M.gold,cx,h-0.24,cz,ry);

function rectTable(px,py,len,wid,axis,perSide,ends){

  }

    axis==='x'? chairAt(x+s*(len/2+0.4),z,x,z) : chairAt(x,z+s*(len/2+0.4),x,z); }
  const n=Math.max(1,Math.round(len/2.2));
  for(let i=0;i<n;i++){const t=-len/2+(i+0.5)*len/n; pieces.push(axis==='x'?{x:x+t,z,kind:'low'}:{x,z:z+t,kind:'low'});}

function pathTable(pxPts,seats,wid=1.0){
  const pts=pxPts.map(p=>new THREE.Vector2(...W(...p)));
  const cum=[0]; for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+pts[i].distanceTo(pts[i-1]));
  const L=cum[cum.length-1];
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];
    clothBox((a.x+b.x)/2,(a.y+b.y)/2,a.distanceTo(b)+0.02,wid,-Math.atan2(b.y-a.y,b.x-a.x));}
  const at=s=>{let i=1;while(i<cum.length-1&&cum[i]<s)i++;const a=pts[i-1],b=pts[i],f=(s-cum[i-1])/(cum[i]-cum[i-1]||1);
    const p=a.clone().lerp(b,f),t=b.clone().sub(a).normalize();return [p,new THREE.Vector2(-t.y,t.x)];};
  const n1=Math.ceil(seats/2),n2=seats-n1;
  [[n1,1],[n2,-1]].forEach(([n,s])=>{for(let i=0;i<n;i++){const [p,nm]=at((i+0.5)/n*L);
    chairAt(p.x+nm.x*s*(wid/2+0.4),p.y+nm.y*s*(wid/2+0.4),p.x,p.y);}});
  const n=Math.max(1,Math.round(L/2.2));
  for(let i=0;i<n;i++){const [p]=at((i+0.5)/n*L); pieces.push({x:p.x,z:p.y,kind:'low'});}
}

const bulbG=new THREE.SphereGeometry(1,10,8);
const chBulbMesh=instanced(bulbG,M.bulb,chBulbs,(ob,[x,y,z,s])=>{ob.position.set(x,y,z);ob.scale.set(s,s*1.4,s);},false);
instanced(bulbG,M.bulb,wallBulbs,(ob,[x,y,z,s])=>{ob.position.set(x,y,z);ob.scale.set(s,s*1.4,s);},false);
const hanging=[...chandeliers,crystalMesh,chBulbMesh];

// ---------- post-processing ----------
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(512,512),0.55,0.45,3.0));
composer.addPass(new OutputPass());

// ---------- controls & camera tour ----------
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.target.set(2,0,0); controls.maxPolarAngle=Math.PI/2.05;
controls.minDistance=1.5; controls.maxDistance=140;
if(/still/.test(location.search)){camera.position.set(23,33,39);controls.target.set(1.2,0,2.2);}

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const K=[
  [0,  V(0,76,2),      V(0,0,-8)],
  [4,  V(2,46,15),     V(2,0,-2)],
  [8,  V(0,12,38),     V(0,0,16)],
  [11, V(0,4.6,25.5),  V(0,2.2,14)],
  [14, V(0,2.7,17),    V(0,1.7,4)],
  [17, V(-2.2,2.6,5),  V(0,1.9,-8)],
  [20, V(0,2.9,-10),   V(0,2.4,-26)],
  [23, V(7,7,-14),     V(15,0.5,-12)],
  [26, V(21,8,-2),     V(15,0.6,-13)],
  [30, V(13,62,25),    V(6,0,-8)],
];
const DUR=K[K.length-1][0];
const posC=new THREE.CatmullRomCurve3(K.map(k=>k[1]),false,'centripetal');
const tgtC=new THREE.CatmullRomCurve3(K.map(k=>k[2]),false,'centripetal');
function tourAt(t){
  t=Math.max(0,Math.min(DUR,t)); let i=1; while(i<K.length-1&&K[i][0]<t)i++;
  const a=K[i-1][0],b=K[i][0]; let f=(t-a)/(b-a); f=f*f*(3-2*f)*0.5+f*0.5;
  const u=(i-1+f)/(K.length-1);
  camera.position.copy(posC.getPoint(u)); camera.lookAt(tgtC.getPoint(u));
}
function overlays(t){
  const fade=(a,b,el)=>{const fi=Math.min(1,Math.max(0,(t-a)/0.6)),fo=Math.min(1,Math.max(0,(b-t)/0.6));
    document.getElementById(el).style.opacity=Math.min(fi,fo);};
  fade(-1,3.6,'vtIntro'); fade(9,14.5,'vtSeats'); fade(22.5,26.5,'vtSide'); fade(28.3,40,'vtOutro');
}
// chandeliers only show from inside the hall, so the bird's-eye view stays clear
function updateHanging(){ const inside=camera.position.y<H+0.3; hanging.forEach(h=>h.visible=inside); }

let touring=false,tourStart=0;
const bTour=document.getElementById('bTour');
function stopTour(){touring=false;bTour.setAttribute('aria-pressed','false');bTour.textContent='▶ סיור מצלמה';controls.enabled=true;
  const d=V(0,0,-1).applyQuaternion(camera.quaternion);controls.target.copy(camera.position).addScaledVector(d,6);}
bTour.onclick=()=>{ if(touring){stopTour();return;}
  touring=true;tourStart=performance.now();controls.enabled=false;bTour.setAttribute('aria-pressed','true');bTour.textContent='■ עצירה';};
function fly(pos,tgt){ if(touring)stopTour(); const p0=camera.position.clone(),t0=controls.target.clone(),st=performance.now();
  const step=()=>{let f=Math.min(1,(performance.now()-st)/900);f=1-Math.pow(1-f,3);
    camera.position.lerpVectors(p0,pos,f);controls.target.lerpVectors(t0,tgt,f);if(f<1)requestAnimationFrame(step);};step();}
document.getElementById('bTop').onclick=()=>fly(V(4,camera.aspect<1?95:62,0.5),V(4,0,0));
document.getElementById('bPersp').onclick=()=>fly(V(28,42,46),V(2,0,0));
document.getElementById('bInside').onclick=()=>fly(V(0,2.7,17),V(0,1.8,4));

function resize(){
  const w=VIDEO?1080:host.clientWidth,h=VIDEO?1920:host.clientHeight;
  renderer.setSize(w,h,!VIDEO); composer.setSize(w,h); composer.setPixelRatio(renderer.getPixelRatio());
  camera.aspect=w/h; camera.updateProjectionMatrix();
  if(!VIDEO&&w<h&&!touring) camera.position.set(22,60,52);
}
addEventListener('resize',resize); resize();
document.getElementById('loading').remove();

if(VIDEO){
  window.renderAt=t=>{tourAt(t);overlays(t);updateHanging();composer.render();};
  window.TOUR_DURATION=DUR;
  document.fonts.ready.then(()=>{window.READY=true;});
}else{
  renderer.setAnimationLoop(()=>{
    if(touring){const t=(performance.now()-tourStart)/1000; tourAt(t); if(t>=DUR)stopTour();}
    else controls.update();
    updateHanging();
    composer.render();
  });
}
</script>
